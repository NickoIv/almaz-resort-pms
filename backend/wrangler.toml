name = "almaz-resort-pms-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
APP_VERSION = "2026.08"

[[d1_databases]]
binding = "DB"
database_name = "almaz_resort_pms_db"
database_id = "1430be6b-5d54-4378-a686-5c7db905f582"
migrations_dir = "migrations"

# Daily backups. KV is used because it works on the free plan with no card;
# R2 must be switched on in the Cloudflare dashboard first.
[[kv_namespaces]]
binding = "BACKUPS"
id = "4b98c535f0814302b915778342ee57be"

# Internal photo documentation. Separate from BACKUPS so images can never
# crowd out the daily database snapshots.
[[kv_namespaces]]
binding = "PHOTOS"
id = "66d93884ca5e40bbb8b005117008d24a"

# To move backups to R2 instead: enable R2 in the dashboard, run
#   npx wrangler r2 bucket create almaz-resort-pms-backups
# then uncomment the block below. The code prefers R2 whenever it is bound,
# so nothing else needs to change.
# [[r2_buckets]]
# binding = "BACKUPS_R2"
# bucket_name = "almaz-resort-pms-backups"

# One trigger, not four.
#
# The Workers free plan allows five cron triggers per *account*, and this
# account runs several Workers. Asking for four here exceeded it and the deploy
# failed with code 10072 — after the Worker had already uploaded, so the failure
# looked like a broken build rather than a quota.
#
# So this fires every five minutes and src/index.ts decides what is due: the
# push sweep every time, the digests at 04:00 and 13:00 UTC (09:00 and 18:00 in
# Almaty), the backup at 04:15 UTC, the delivery prune at 03:00 UTC. Five
# minutes is also the granularity staff notice — a cleaning breach reaching a
# phone within five minutes reads as "just now".
[triggers]
crons = ["*/5 * * * *"]