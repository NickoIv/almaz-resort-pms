<!--
  App icon: a T monogram on the Taura Night surface, in the accent used by the
  app itself (#c9793b). Built from plain rectangles rather than a <text>
  element on purpose — the PNG sizes are rasterised at build time by librsvg,
  which would substitute whatever font it happened to find, and an icon that
  renders differently on the machine that built it is not an icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1b2019"/>
  <!-- Crossbar and stem of the T, sharing one accent colour. -->
  <rect x="120" y="150" width="272" height="58" rx="16" fill="#c9793b"/>
  <rect x="227" y="150" width="58" height="228" rx="16" fill="#c9793b"/>
</svg>
